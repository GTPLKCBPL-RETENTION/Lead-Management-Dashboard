<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Field Update — GTPL KCBPL</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --navy: #0f2942;
    --blue: #1e5a8e;
    --teal: #2f9e6f;
    --red: #c0453a;
    --grey: #667a8c;
    --bg: #eef2f6;
    --card: #ffffff;
    --border: #dbe3ea;
    --text: #1b2a38;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg);
    color: var(--text); -webkit-text-size-adjust: 100%;
  }
  header {
    background: var(--navy); color: #fff; padding: 16px 18px;
    display: flex; align-items: center; gap: 12px;
  }
  header img { height: 34px; width: auto; border-radius: 4px; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .sub { font-size: 11px; color: #b7c6d4; margin-top: 2px; }

  main { padding: 18px 16px 60px; max-width: 520px; margin: 0 auto; }

  .search-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 18px; margin-bottom: 18px;
  }
  .search-card label {
    font-size: 13px; font-weight: 600; color: var(--grey); display: block; margin-bottom: 6px;
  }
  .search-row { display: flex; gap: 10px; }
  .search-row input[type=text] {
    flex: 1; padding: 14px 14px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 16px; min-width: 0;
  }
  .big-btn {
    background: var(--blue); color: #fff; border: none; padding: 14px 20px;
    border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .big-btn:hover { background: var(--navy); }
  .big-btn:disabled { background: var(--grey); cursor: not-allowed; }
  .big-btn.full { width: 100%; }
  .big-btn.save { background: var(--teal); }
  .big-btn.save:hover { background: #257c58; }

  .status-msg {
    padding: 12px 14px; border-radius: 8px; font-size: 14px; margin-bottom: 16px;
  }
  .status-msg.info { background: #eaf0fb; color: var(--blue); }
  .status-msg.error { background: #fdecea; color: var(--red); }
  .status-msg.success { background: #e2f3e9; color: var(--teal); }

  .lead-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 18px; margin-bottom: 16px;
  }
  .lead-card h2 {
    font-size: 16px; margin: 0 0 2px; color: var(--navy);
  }
  .lead-card .lead-sub {
    font-size: 12px; color: var(--grey); margin-bottom: 16px;
  }

  .field-group { margin-bottom: 16px; }
  .field-group label {
    font-size: 13px; font-weight: 600; color: var(--grey); display: block; margin-bottom: 6px;
  }
  .field-group input[type=text],
  .field-group input[type=number],
  .field-group select,
  .field-group textarea {
    width: 100%; padding: 12px 12px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 15px; background: #fff; font-family: inherit;
  }
  .field-group textarea { resize: vertical; min-height: 64px; }

  .field-changed {
    border-color: var(--teal) !important;
    background: #f2faf6;
  }

  .card-status {
    padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-top: 4px; margin-bottom: 12px;
    display: none;
  }
  .card-status.info { background: #eaf0fb; color: var(--blue); display: block; }
  .card-status.error { background: #fdecea; color: var(--red); display: block; }
  .card-status.success { background: #e2f3e9; color: var(--teal); display: block; }

  .empty-note { color: var(--grey); font-size: 14px; text-align: center; padding: 10px 0; }
</style>
</head>
<body>

<header>
  <img src="https://raw.githubusercontent.com/GTPLKCBPL-RETENTION/-Lead-validation-portal/main/logo.png" alt="GTPL KCBPL logo">
  <div>
    <h1>Field Update</h1>
    <div class="sub">GTPL KCBPL &mdash; Quick Lead Update</div>
  </div>
</header>

<main>
  <div class="search-card">
    <label for="mobile-input">Mobile number</label>
    <div class="search-row">
      <input type="text" id="mobile-input" placeholder="e.g. 9876543210" inputmode="numeric" autofocus>
      <button class="big-btn" onclick="searchLead()">Search</button>
    </div>
  </div>

  <div id="search-status" class="status-msg" style="display:none;"></div>

  <div id="results"></div>
</main>

<script>
// =============================================================================
// CONFIG — same Apps Script Web App URL as the main dashboard.
// =============================================================================
var API_BASE = "https://script.google.com/macros/s/AKfycby9cqHiiB8o8vE_AoQpb_yh7JQSXKD8LrXhVdXgWU1NLdmDmofRwKm23GuTova_MIXjMw/exec";

// Only these 4 fields are editable on this page — kept deliberately short
// for quick field use. Header names must exactly match Code.gs's
// EDITABLE_COLUMNS keys.
var FIELDS = [
  { label: "Speed / Bandwidth", header: "Speed / Bandwidth", type: "text", placeholder: "e.g. 100 Mbps" },
  { label: "Price (Rs.)", header: "Price (Rs.)", type: "number", placeholder: "e.g. 15000" },
  { label: "RM Remarks", header: "RM Remarks", type: "textarea", placeholder: "Notes for this lead" },
  { label: "Lead Status", header: "LEAD STATUS", type: "select",
    options: ["New Lead", "Repeat call required", "Lead Close", "Interested in Home Connection", "Not Interested/ Not Required",
              "Existing BB", "Lead Lost to Competitor", "The customer raised the inquiry incorrectly",
              "Invalid / Incorrect Mobile Number", "Call disconnected / No Response; 3 retries failed.",
              "Out of Service Area (Outside West Bengal)", "Out of Service Area in West Bengal",
              "Duplicate Entry", "Under Discussion with Sales", "ISP/P2P Lead",
              "General Inquiry for Charges", "Feedback Pending from Sales.", "Hold from Customer End",
              "Not Interested / Not Required – Feedback Shared by RM"] }
];

function showSearchStatus(message, type) {
  var el = document.getElementById('search-status');
  el.textContent = message;
  el.className = 'status-msg ' + type;
  el.style.display = 'block';
}
function hideSearchStatus() {
  document.getElementById('search-status').style.display = 'none';
}

async function postToScript(payload) {
  var res = await fetch(API_BASE, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload),
    redirect: 'follow'
  });
  return res.json();
}

async function searchLead() {
  var mobile = document.getElementById('mobile-input').value.trim();
  document.getElementById('results').innerHTML = '';
  hideSearchStatus();

  if (!mobile) {
    showSearchStatus('Enter a mobile number to search.', 'error');
    return;
  }

  showSearchStatus('Searching\u2026', 'info');
  try {
    var data = await postToScript({ mobile: mobile });
    if (!data.success) {
      showSearchStatus(data.error || 'Search failed.', 'error');
      return;
    }
    if (!data.matches || data.matches.length === 0) {
      showSearchStatus('No lead found with that mobile number.', 'error');
      return;
    }
    hideSearchStatus();
    renderResults(data.matches, mobile);
  } catch (err) {
    showSearchStatus('Could not reach the server. Please try again.', 'error');
    console.error(err);
  }
}

// Allow pressing Enter in the mobile field to search.
document.getElementById('mobile-input').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') { e.preventDefault(); searchLead(); }
});

function renderResults(matches, searchedMobile) {
  var container = document.getElementById('results');
  container.innerHTML = '';

  if (matches.length > 1) {
    var note = document.createElement('div');
    note.className = 'status-msg info';
    note.textContent = matches.length + ' leads found with this mobile number.';
    container.appendChild(note);
  }

  matches.forEach(function (match, idx) {
    var cardId = 'lead-card-' + idx;
    var card = document.createElement('div');
    card.className = 'lead-card';
    card.id = cardId;

    var contactName = match.values['Contact Person name'] || '(no name)';
    var mobileVal = match.values['Mobile No'] || '';
    var rmName = match.values['RM NAME'] || '\u2014';

    var fieldsHtml = FIELDS.map(function (f, fIdx) {
      var currentVal = match.values[f.header];
      currentVal = (currentVal === null || currentVal === undefined) ? '' : String(currentVal);
      var fieldId = cardId + '-field-' + fIdx;

      var inputHtml;
      if (f.type === 'textarea') {
        inputHtml = '<textarea id="' + fieldId + '" data-header="' + f.header + '" placeholder="' + f.placeholder + '">' +
          escapeHtml_(currentVal) + '</textarea>';
      } else if (f.type === 'select') {
        var optionsHtml = f.options.map(function (opt) {
          var selected = opt.trim().toLowerCase() === currentVal.trim().toLowerCase() ? ' selected' : '';
          return '<option value="' + escapeHtml_(opt) + '"' + selected + '>' + escapeHtml_(opt) + '</option>';
        }).join('');
        // If the current sheet value doesn't match any known option, show it
        // as an extra first option so nothing looks silently wiped out.
        var matchesKnown = f.options.some(function (opt) { return opt.trim().toLowerCase() === currentVal.trim().toLowerCase(); });
        if (currentVal && !matchesKnown) {
          optionsHtml = '<option value="' + escapeHtml_(currentVal) + '" selected>' + escapeHtml_(currentVal) + ' (current)</option>' + optionsHtml;
        }
        inputHtml = '<select id="' + fieldId + '" data-header="' + f.header + '">' + optionsHtml + '</select>';
      } else if (f.type === 'number') {
        inputHtml = '<input type="number" step="any" id="' + fieldId + '" data-header="' + f.header + '" value="' +
          escapeHtml_(currentVal) + '" placeholder="' + f.placeholder + '">';
      } else {
        inputHtml = '<input type="text" id="' + fieldId + '" data-header="' + f.header + '" value="' +
          escapeHtml_(currentVal) + '" placeholder="' + f.placeholder + '">';
      }

      return (
        '<div class="field-group">' +
          '<label>' + f.label + '</label>' +
          inputHtml +
        '</div>'
      );
    }).join('');

    card.innerHTML =
      '<h2>' + escapeHtml_(contactName) + '</h2>' +
      '<div class="lead-sub">' + escapeHtml_(mobileVal) + ' &middot; RM: ' + escapeHtml_(rmName) + '</div>' +
      fieldsHtml +
      '<div class="card-status" data-role="card-status"></div>' +
      '<button class="big-btn save full" onclick="saveChanges(\'' + cardId + '\', \'' + searchedMobile.replace(/'/g, "\\'") + '\')">Save Changes</button>';

    card._originalValues = {};
    FIELDS.forEach(function (f) {
      var v = match.values[f.header];
      card._originalValues[f.header] = (v === null || v === undefined) ? '' : String(v);
    });

    container.appendChild(card);

    // Highlight a field as soon as it's edited, so the rep can see at a
    // glance which values are about to change before hitting Save.
    FIELDS.forEach(function (f, fIdx) {
      var fieldId = cardId + '-field-' + fIdx;
      var el = document.getElementById(fieldId);
      if (!el) return;
      el.addEventListener('input', function () { markChanged_(el, card, f.header); });
      el.addEventListener('change', function () { markChanged_(el, card, f.header); });
    });
  });
}

function markChanged_(el, card, header) {
  var original = card._originalValues[header] || '';
  if (el.value.trim() !== original.trim()) {
    el.classList.add('field-changed');
  } else {
    el.classList.remove('field-changed');
  }
}

function escapeHtml_(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

async function saveChanges(cardId, mobile) {
  var card = document.getElementById(cardId);
  var statusEl = card.querySelector('[data-role="card-status"]');
  var saveBtn = card.querySelector('.big-btn.save');

  // Only send fields the rep actually changed.
  var changes = [];
  FIELDS.forEach(function (f, fIdx) {
    var fieldId = cardId + '-field-' + fIdx;
    var el = document.getElementById(fieldId);
    if (!el) return;
    var newVal = el.value.trim();
    var original = (card._originalValues[f.header] || '').trim();
    if (newVal !== original) {
      changes.push({ header: f.header, value: newVal });
    }
  });

  if (changes.length === 0) {
    statusEl.className = 'card-status info';
    statusEl.textContent = 'No changes to save.';
    return;
  }

  saveBtn.disabled = true;
  statusEl.className = 'card-status info';
  statusEl.textContent = 'Saving\u2026';

  var failed = [];
  for (var i = 0; i < changes.length; i++) {
    try {
      var data = await postToScript({ mobile: mobile, column: changes[i].header, value: changes[i].value });
      if (data.success) {
        card._originalValues[changes[i].header] = changes[i].value;
      } else {
        failed.push(changes[i].header + ': ' + (data.error || 'failed'));
      }
    } catch (err) {
      failed.push(changes[i].header + ': could not reach server');
    }
  }

  saveBtn.disabled = false;

  if (failed.length === 0) {
    statusEl.className = 'card-status success';
    statusEl.textContent = 'Saved to the Google Sheet.';
    // Clear the "changed" highlight now that everything's saved.
    FIELDS.forEach(function (f, fIdx) {
      var el = document.getElementById(cardId + '-field-' + fIdx);
      if (el) el.classList.remove('field-changed');
    });
  } else {
    statusEl.className = 'card-status error';
    statusEl.textContent = 'Some fields failed to save: ' + failed.join('; ');
  }
}
</script>
</body>
</html>
